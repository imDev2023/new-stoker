# Local development database: `docker compose up -d`. Tests start their own throwaway database.
services:
  postgres:
    image: postgres:17-alpine
    container_name: new-stoker-postgres
    environment:
      POSTGRES_USER: launchpad
      POSTGRES_PASSWORD: launchpad
      POSTGRES_DB: launchpad
    ports:
      - "127.0.0.1:5462:5432"
    volumes:
      - new-stoker-postgres:/var/lib/postgresql/data
volumes:
  new-stoker-postgres:
